name: 產生 Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: 建置可安裝 APK
    runs-on: ubuntu-latest

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 設定 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 設定 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安裝 App 依賴
        run: npm ci

      - name: 產生 Android 原生專案
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: 建置 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 整理 APK 檔案
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/SafeStride-mvp-debug.apk

      - name: 上傳 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeStride-mvp-debug-apk
          path: dist-apk/SafeStride-mvp-debug.apk
          if-no-files-found: error

      - name: 建立或更新 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-apk/SafeStride-mvp-debug.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-apk/SafeStride-mvp-debug.apk \
              --title "SafeStride $GITHUB_REF_NAME" \
              --notes "SafeStride MVP 測試版 APK。此版本不使用攝像頭，僅以手機端步行資料進行本機分析。"
          fi
