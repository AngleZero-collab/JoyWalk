name: 產生 Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: 建置可直接安裝 APK
    runs-on: ubuntu-latest

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 設定 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 設定 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安裝 App 依賴
        run: npm ci

      - name: 產生 Android 原生專案
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: 建置 Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 整理 APK 檔案
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/SafeStride-mvp-release.apk

      - name: 上傳 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeStride-mvp-release-apk
          path: dist-apk/SafeStride-mvp-release.apk
          if-no-files-found: error

      - name: 建立或更新 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-apk/SafeStride-mvp-release.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-apk/SafeStride-mvp-release.apk \
              --title "SafeStride $GITHUB_REF_NAME" \
              --notes "SafeStride MVP Release APK，已內含 JavaScript bundle，可直接安裝到 Android 手機執行。此版本不使用攝像頭、不使用定位，僅以手機端步行資料進行本機分析。"
          fi
